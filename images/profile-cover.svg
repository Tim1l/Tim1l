  <g fill="none" stroke="url(#line)" stroke-width="1.5">
    <circle cx="1264" cy="241" r="161"/>
    <ellipse cx="1264" cy="241" rx="161" ry="62"/>
    <ellipse cx="1264" cy="241" rx="161" ry="62" transform="rotate(60 1264 241)"/>
