      <rect x="281" y="360" width="186" height="46" rx="12"/>
      <rect x="482" y="360" width="186" height="46" rx="12"/>
      <rect x="683" y="360" width="186" height="46" rx="12"/>
    </g>
    <g fill="#d3e8eb" font-size="14" letter-spacing="1.3" text-anchor="middle">
